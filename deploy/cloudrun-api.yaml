apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: pairuptoday-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      serviceAccountName: pairuptoday-api@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/pairuptoday-api:TAG
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: CLIENT_ORIGIN
              value: https://pairuptoday.com
            - name: ADMIN_ORIGIN
              value: https://admin.pairuptoday.com
            - name: APITXT_BASE_URL
              value: https://apitxt.com
            - name: SUPABASE_URL
              value: https://PROJECT_REF.supabase.co
            - name: FIREBASE_PROJECT_ID
              value: PROJECT_ID
            - name: FIREBASE_CLIENT_EMAIL
              value: FIREBASE_ADMIN_SERVICE_ACCOUNT_EMAIL
            - name: FIREBASE_DATABASE_URL
              value: FIREBASE_REALTIME_DATABASE_URL
            - name: APITXT_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: apitxt-api-key
            - name: OTP_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: pairuptoday-otp-hmac-secret
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: pairuptoday-session-secret
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: supabase-service-role-key
            - name: BANK_ACCOUNT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: pairuptoday-bank-account-encryption-key
            - name: RAZORPAY_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: razorpay-key-id
            - name: RAZORPAY_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: razorpay-key-secret
            - name: RAZORPAY_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: razorpay-webhook-secret
            - name: FIREBASE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: firebase-admin-private-key
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: google-maps-api-key
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
